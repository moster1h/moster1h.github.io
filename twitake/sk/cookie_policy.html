<!doctype html>
<html lang="sk" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/static/appwebsite/app-settings.js"></script>
    <script>
      (() => {
        try {
          window.VidTakAppSettings.applyTheme()
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>TwiTake – Zásady používania súborov cookie</title>
    <meta name="description" content="Posledná aktualizácia: 10. mája 2023, Vitajte v TwiTake! Úvod 1.1 VidTak (ďalej len „VidTak“ alebo „my“) môžeme používať súbory cookie alebo podobné techno">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vidtak.net/twitake/sk/cookie_policy.html">
    <link rel="icon" href="/static/favicon_io/favicon.ico">
    <link rel="stylesheet" href="/static/legal-i18n/legal.css">
  </head>
  <body
    data-app="twitake"
    data-app-name="TwiTake"
    data-locale="sk"
    data-document="cookie_policy.html"
  >
    <div id="legal-app" v-cloak>
      <header class="legal-toolbar">
        <a class="legal-brand" :href="homeLink" aria-label="VidTak Apps">VIDTAK <small>APPS</small></a>
        <nav class="legal-documents" :aria-label="ui.documents">
          <a
            v-for="item in documentLinks"
            :key="item.file"
            :class="{ active: item.file === documentFile }"
            :href="item.href"
          >{{ item.label }}</a>
        </nav>
        <button class="legal-theme" type="button" :aria-label="themeLabel" :title="themeLabel" @click="toggleTheme">
          <img
            class="theme-mode-icon"
            :src="theme === 'dark' ? '/static/legal-i18n/theme-sun.svg' : '/static/legal-i18n/theme-moon.svg'"
            alt=""
            aria-hidden="true"
          >
        </button>
        <label class="legal-language">
          <span>{{ ui.language }}</span>
          <select :value="locale" @change="changeLocale">
            <option v-for="item in locales" :key="item.code" :value="item.code">{{ item.label }}</option>
          </select>
        </label>
      </header>
      <aside v-if="usesEnglishFallback" class="translation-notice" role="status">{{ fallbackNotice }}</aside>
      <main class="legal-content" v-html="currentMessage.content"></main>
      <footer class="legal-footer">© 2026 VidTak Apps.</footer>
    </div>
    <noscript><p class="noscript">JavaScript is required to display this policy.</p></noscript>
    <script src="/static/appwebsite/vue.js"></script>
    <script src="/static/appwebsite/vue-i18n.js"></script>
    <script src="/static/legal-i18n/navigation.js"></script>
    <script src="/static/legal-i18n/catalogs/twitake-cookie.js"></script>
    <script src="/static/legal-i18n/legal-app.js"></script>
  </body>
</html>
